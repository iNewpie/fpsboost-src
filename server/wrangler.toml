# fpsboost.ir — website + account API for FPS Boost. Deploy with:  bash server/deploy.sh
name = "fpsboost-site"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "fpsboost.ir", custom_domain = true }]   # the zone must be Active on this Cloudflare account before the first deploy

[vars]
APP_NAME = "FPS Boost"
PRICES = '{"1": 150000, "3": 390000, "12": 1290000}'   # months → Toman
DOWNLOAD_URL = "https://github.com/iNewpie/fpsboost/releases/latest/download/FPSBoost-Setup.exe"   # where /download sends people (the installer)
APP_LATEST = "1.0.0"                      # newest app version — the app updates itself when this is higher (app/scripts/release.sh writes these two)
APP_SHA256 = "7fe1a4555c7b7e04e156867e00686801b67b0cd9611a595cb3af8b82b924570e"                           # SHA-256 of that installer; the app refuses to install a download that does not match
SUPPORT = ""                              # shown in the footer + /terms: an email, a https:// link or a @telegram handle
MAX_MACHINES = "2"                        # PCs per account
TRIAL_DAYS = "0"                          # free days for a fresh account (0 = none)
ZARINPAL_SANDBOX = "1"                    # "1" = sandbox.zarinpal.com while testing, "0" = real payments

# Accounts, subscriptions, payments: one Durable Object with SQLite (free plan).
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]
