<header class="tb" id="tb">
  <div class="tb-l"><img src="assets/logo.png" alt="" class="tb-mark"><b class="tb-name">FPS BOOST</b><span class="tb-ver" id="tbver"></span></div>
  <div class="tb-c" id="tbguard" hidden><i class="dot"></i><span></span></div>
  <div class="tb-r">
    <button class="wb" data-win="min" title="Minimize"><svg><use href="#i-min"/></svg></button>
    <button class="wb" data-win="max" title="Maximize"><svg id="maxico"><use href="#i-max"/></svg></button>
    <button class="wb close" data-win="close" title="Close"><svg><use href="#i-x"/></svg></button>
  </div>
</header>

<div id="login" class="screen login" hidden>
  <div class="aura"></div>
  <div class="lcard">
    <img src="assets/logo.png" alt="" class="lmark">
    <h1>FPS Boost</h1><p class="muted" data-i18n="login_sub"></p>
    <form id="loginform" autocomplete="on">
      <label><span data-i18n="username"></span><input id="lu" autocomplete="username" spellcheck="false" required maxlength="40"></label>
      <label><span data-i18n="password"></span><input id="lp" type="password" autocomplete="current-password" required maxlength="200"></label>
      <p class="err" id="lerr"></p>
      <button type="submit" class="pri wide big" id="lbtn"><span data-i18n="login"></span></button>
    </form>
    <p class="lfoot"><a href="#" data-open="/register" data-i18n="no_account"></a><span>·</span><a href="#" data-open="/account" data-i18n="forgot"></a><span>·</span><a href="#" class="lang"></a></p>
  </div>
  <p class="lver muted"><span id="version1"></span> · <span data-i18n="win"></span></p>
</div>

<div id="main" class="screen app" hidden>
  <aside class="side">
    <nav class="nav">
      <button class="nav-i on" data-page="home"><svg><use href="#i-home"/></svg><span data-i18n="nav_home"></span></button>
      <button class="nav-i" data-page="fps"><svg><use href="#i-bolt"/></svg><span data-i18n="nav_fps"></span><i class="cnt" id="cnt-fps"></i></button>
      <button class="nav-i" data-page="network"><svg><use href="#i-wifi"/></svg><span data-i18n="nav_network"></span><i class="cnt" id="cnt-network"></i></button>
      <button class="nav-i" data-page="games"><svg><use href="#i-pad"/></svg><span data-i18n="nav_games"></span></button>
      <button class="nav-i" data-page="guard"><svg><use href="#i-shield"/></svg><span data-i18n="nav_guard"></span><i class="cnt live" id="cnt-guard"></i></button>
      <button class="nav-i" data-page="tools"><svg><use href="#i-tool"/></svg><span data-i18n="nav_tools"></span></button>
      <button class="nav-i" data-page="settings"><svg><use href="#i-gear"/></svg><span data-i18n="nav_settings"></span></button>
    </nav>
    <div class="subcard" id="subcard"></div>
    <button class="ucard" id="ucard" data-page="account"></button>
    <button class="lang side-lang"></button>
  </aside>

  <main class="content" id="content">
    <div class="prog" id="prog" hidden><i></i></div>
    <div id="banner" class="banner" hidden><svg><use href="#i-warn"/></svg><span></span></div>
    <div id="ubanner" class="banner info" hidden><svg><use href="#i-download"/></svg><span id="ubanner-t"></span><button class="pri sm" id="ubanner-b"></button></div>

    <section data-page="home">
      <div class="ph"><div><h2 id="hi"></h2><p class="muted" id="sysline"></p></div></div>
      <div class="hero">
        <div class="score">
          <svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle cx="60" cy="60" r="52" class="ring-fg" id="ringfg"/></svg>
          <div class="score-n"><b id="score">0</b><small data-i18n="score"></small></div>
        </div>
        <div class="hero-mid">
          <div class="tile"><span data-i18n="tiles_active"></span><b id="t-active">–</b><small id="t-active-s"></small></div>
          <div class="tile"><span data-i18n="tiles_ping"></span><b id="t-ping">–</b><small id="t-ping-s"></small></div>
          <div class="tile"><span data-i18n="tiles_guard"></span><b id="t-guard">–</b><small id="t-guard-s"></small></div>
        </div>
        <div class="hero-act">
          <button class="pri big boost" id="boost"><svg><use href="#i-bolt"/></svg><span data-i18n="boost_now"></span></button>
          <p class="muted" data-i18n="boost_sub"></p>
          <button class="ghost sm" id="unboost" data-i18n="restore_all"></button>
        </div>
      </div>
      <div class="two">
        <div class="card guardcard" id="guardcard">
          <h3><svg><use href="#i-shield"/></svg><span data-i18n="guard_title"></span><i class="pill" id="gpill"></i></h3>
          <div class="gstate" id="gstate"></div>
          <div class="meter"><div class="meter-h"><span data-i18n="ram_in_use"></span><b id="ramtxt">–</b></div><div class="bar"><i id="rambar"></i></div></div>
          <div class="gstats"><div><b id="g-boosted">0</b><span data-i18n="g_boosted"></span></div><div><b id="g-freed">0</b><span data-i18n="g_freed"></span></div><div><b id="g-enforced">0</b><span data-i18n="g_enforced"></span></div></div>
        </div>
        <div class="card"><h3><svg><use href="#i-pc"/></svg><span data-i18n="this_pc"></span></h3><dl class="kv" id="pcinfo"></dl></div>
      </div>
      <div class="card rpcard" id="rpcard"></div>
      <div class="card"><h3><svg><use href="#i-refresh"/></svg><span data-i18n="activity"></span></h3><ul class="log" id="log"></ul></div>
    </section>

    <section data-page="fps" hidden>
      <div class="ph"><div><h2 data-i18n="fps_title"></h2><p class="muted" data-i18n="fps_sub"></p></div><div class="acts"><button class="pri" data-rec="fps"><svg><use href="#i-bolt"/></svg><span data-i18n="apply_recommended"></span></button><button class="ghost" data-revert="fps" data-i18n="revert_all"></button></div></div>
      <div class="chips" data-filter-for="fps"><button class="chip on" data-f="all" data-i18n="all"></button><button class="chip" data-f="rec" data-i18n="rec"></button><button class="chip" data-f="adv" data-i18n="adv"></button><span class="muted" id="fps-count"></span></div>
      <div class="list" id="list-fps"></div>
    </section>

    <section data-page="network" hidden>
      <div class="ph"><div><h2 data-i18n="net_title"></h2><p class="muted" data-i18n="net_sub"></p></div><div class="acts"><button class="pri" data-rec="network"><svg><use href="#i-wifi"/></svg><span data-i18n="apply_recommended"></span></button><button class="ghost" data-revert="network" data-i18n="revert_all"></button></div></div>
      <div class="card ping">
        <div class="ping-h"><div><h3><svg><use href="#i-zap"/></svg><span data-i18n="ping_title"></span></h3><p class="muted" data-i18n="ping_sub"></p></div><div class="row"><input id="pinghosts" class="mono" spellcheck="false"><button class="pri" id="pingbtn" data-i18n="ping_run"></button></div></div>
        <div class="pingr" id="pingr"></div>
      </div>
      <div class="card dns" id="dnscard">
        <div class="ping-h"><div><h3><svg><use href="#i-radar"/></svg><span data-i18n="dns_title"></span><i class="pill idle" id="dnsisp" hidden></i></h3><p class="muted" data-i18n="dns_sub"></p></div><div class="row dns-acts"><button class="ghost" id="dnsbest" hidden><svg><use href="#i-star"/></svg><span></span></button><button class="pri" id="dnsbtn"><svg><use href="#i-radar"/></svg><span data-i18n="dns_scan"></span></button></div></div>
        <div class="dnsr" id="dnsr"></div>
      </div>
      <div class="chips" data-filter-for="network"><button class="chip on" data-f="all" data-i18n="all"></button><button class="chip" data-f="rec" data-i18n="rec"></button><button class="chip" data-f="adv" data-i18n="adv"></button><span class="muted" id="network-count"></span></div>
      <div class="list" id="list-network"></div>
    </section>

    <section data-page="games" hidden>
      <div class="ph"><div><h2 data-i18n="games_title"></h2><p class="muted" data-i18n="games_sub"></p></div></div>
      <div class="games" id="games"></div>
    </section>

    <section data-page="guard" hidden>
      <div class="ph"><div><h2 data-i18n="guard_title"></h2><p class="muted" data-i18n="guard_sub"></p></div><div class="acts"><button class="pri" id="cleannow"><svg><use href="#i-ram"/></svg><span data-i18n="clean_now"></span></button></div></div>
      <div class="gtop">
        <div class="card gbig" id="gbig"></div>
        <div class="card">
          <h3><svg><use href="#i-ram"/></svg><span data-i18n="ram_title"></span></h3>
          <div class="meter big"><div class="meter-h"><span data-i18n="ram_in_use"></span><b id="ramtxt2">–</b></div><div class="bar"><i id="rambar2"></i></div></div>
          <div class="gstats"><div><b id="g2-boosted">0</b><span data-i18n="g_boosted"></span></div><div><b id="g2-freed">0</b><span data-i18n="g_freed"></span></div><div><b id="g2-enforced">0</b><span data-i18n="g_enforced"></span></div></div>
        </div>
      </div>
      <div class="card set" id="guardset"></div>
      <div class="card"><h3><svg><use href="#i-clock"/></svg><span data-i18n="guard_log"></span></h3><ul class="log" id="glog"></ul></div>
    </section>

    <section data-page="tools" hidden>
      <div class="ph"><div><h2 data-i18n="tools_title"></h2><p class="muted" data-i18n="tools_sub"></p></div></div>
      <div class="tools" id="tools"></div>
    </section>

    <section data-page="account" hidden>
      <div class="ph"><div><h2 data-i18n="acc_title"></h2><p class="muted" data-i18n="acc_sub"></p></div><div class="acts"><button class="ghost" id="acc-refresh"><svg><use href="#i-refresh"/></svg><span data-i18n="acc_refresh"></span></button></div></div>
      <div id="account"></div>
    </section>

    <section data-page="settings" hidden>
      <div class="ph"><div><h2 data-i18n="settings_title"></h2><p class="muted" id="settings-sub"></p></div></div>
      <div id="settings"></div>
    </section>
  </main>
</div>
