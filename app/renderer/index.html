<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
<title>FPS Boost</title><link rel="stylesheet" href="styles.css"></head>
<body>
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 11-14h-8z"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10.5 10.5 0 0 1 14 0M8.5 15.5a5.5 5.5 0 0 1 7 0M12 19h.01"/></symbol>
  <symbol id="i-pad" viewBox="0 0 24 24"><path d="M6 8h12a4 4 0 0 1 4 4v3a3 3 0 0 1-5.4 1.8L15 15H9l-1.6 1.8A3 3 0 0 1 2 15v-3a4 4 0 0 1 4-4zM7 11v3M5.5 12.5h3M16 11.5h.01M18.5 13h.01"/></symbol>
  <symbol id="i-tool" viewBox="0 0 24 24"><path d="m3 21 8.5-8.5M14.5 6.5a4 4 0 1 0 3 3l3-3-3-3-3 3z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-pc" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 21h20zM12 10v4M12 17.5h.01"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
</svg>

<div class="tb" id="tb"><img src="logo.png" alt="" class="tb-mark"><b class="tb-name">FPS BOOST</b><span class="tb-user" id="tbuser" hidden><svg><use href="#i-user"/></svg><span></span></span></div>

<div id="login" class="screen login" hidden>
  <div class="lcard">
    <img src="logo.png" alt="" class="lmark"><h1>FPS Boost</h1><p class="muted" data-i18n="login_sub"></p>
    <form id="loginform" autocomplete="on">
      <label><span data-i18n="username"></span><input id="lu" autocomplete="username" spellcheck="false" required maxlength="40"></label>
      <label><span data-i18n="password"></span><input id="lp" type="password" autocomplete="current-password" required maxlength="200"></label>
      <p class="err" id="lerr"></p>
      <button type="submit" class="pri wide" id="lbtn" data-i18n="login"></button>
    </form>
    <p class="lfoot"><a href="#" data-open="/register" data-i18n="no_account"></a><span>·</span><a href="#" data-open="/account" data-i18n="forgot"></a><span>·</span><a href="#" class="lang"></a></p>
  </div>
  <p class="lver muted"><span id="version1"></span> · <span data-i18n="win"></span></p>
</div>

<div id="main" class="screen app" hidden>
  <aside class="side">
    <nav class="nav">
      <button class="nav-i on" data-page="home"><svg><use href="#i-home"/></svg><span data-i18n="nav_home"></span></button>
      <button class="nav-i" data-page="fps"><svg><use href="#i-bolt"/></svg><span data-i18n="nav_fps"></span><i class="cnt" id="cnt-fps"></i></button>
      <button class="nav-i" data-page="network"><svg><use href="#i-wifi"/></svg><span data-i18n="nav_network"></span><i class="cnt" id="cnt-network"></i></button>
      <button class="nav-i" data-page="games"><svg><use href="#i-pad"/></svg><span data-i18n="nav_games"></span></button>
      <button class="nav-i" data-page="tools"><svg><use href="#i-tool"/></svg><span data-i18n="nav_tools"></span></button>
      <button class="nav-i" data-page="settings"><svg><use href="#i-gear"/></svg><span data-i18n="nav_settings"></span></button>
    </nav>
    <div class="subcard" id="subcard"></div>
    <button class="lang side-lang"></button>
  </aside>

  <main class="content">
    <div id="banner" class="banner" hidden><svg><use href="#i-warn"/></svg><span></span></div>
    <div id="ubanner" class="banner info" hidden><svg><use href="#i-refresh"/></svg><span id="ubanner-t"></span><button class="pri sm" id="ubanner-b"></button></div>

    <section data-page="home">
      <div class="ph"><div><h2 id="hi"></h2><p class="muted" id="sysline" data-i18n="home_sub"></p></div></div>
      <div class="tiles">
        <div class="tile"><span data-i18n="tiles_active"></span><b id="t-active">–</b><small id="t-active-s"></small></div>
        <div class="tile"><span data-i18n="tiles_ping"></span><b id="t-ping">–</b><small id="t-ping-s"></small></div>
        <div class="tile"><span data-i18n="tiles_state"></span><b id="t-state">–</b><small id="t-state-s"></small></div>
      </div>
      <div class="boost">
        <div><h3 data-i18n="boost_title"></h3><p class="muted" data-i18n="boost_sub"></p></div>
        <div class="boost-a"><button class="pri big" id="boost"><svg><use href="#i-bolt"/></svg><span data-i18n="boost_now"></span></button><button class="ghost" id="unboost" data-i18n="restore_all"></button></div>
      </div>
      <div class="two">
        <div class="card"><h3><svg><use href="#i-pc"/></svg><span data-i18n="this_pc"></span></h3><dl class="kv" id="pcinfo"></dl></div>
        <div class="card"><h3><svg><use href="#i-refresh"/></svg><span data-i18n="activity"></span></h3><ul class="log" id="log"></ul></div>
      </div>
    </section>

    <section data-page="fps" hidden>
      <div class="ph"><div><h2 data-i18n="fps_title"></h2><p class="muted" data-i18n="fps_sub"></p></div><div class="acts"><button class="pri" data-rec="fps" data-i18n="apply_recommended"></button><button class="ghost" data-revert="fps" data-i18n="revert_all"></button></div></div>
      <div class="chips" data-filter-for="fps"><button class="chip on" data-f="all" data-i18n="all"></button><button class="chip" data-f="rec" data-i18n="rec"></button><button class="chip" data-f="adv" data-i18n="adv"></button><span class="muted" id="fps-count"></span></div>
      <div class="list" id="list-fps"></div>
    </section>

    <section data-page="network" hidden>
      <div class="ph"><div><h2 data-i18n="net_title"></h2><p class="muted" data-i18n="net_sub"></p></div><div class="acts"><button class="pri" data-rec="network" data-i18n="apply_recommended"></button><button class="ghost" data-revert="network" data-i18n="revert_all"></button></div></div>
      <div class="card ping"><div class="ping-h"><div><h3 data-i18n="ping_title"></h3><p class="muted" data-i18n="ping_sub"></p></div><div class="row"><input id="pinghosts" class="mono" spellcheck="false"><button class="ghost" id="pingbtn" data-i18n="ping_run"></button></div></div><div class="pingr" id="pingr"></div></div>
      <div class="chips" data-filter-for="network"><button class="chip on" data-f="all" data-i18n="all"></button><button class="chip" data-f="rec" data-i18n="rec"></button><button class="chip" data-f="adv" data-i18n="adv"></button><span class="muted" id="network-count"></span></div>
      <div class="list" id="list-network"></div>
    </section>

    <section data-page="games" hidden>
      <div class="ph"><div><h2 data-i18n="games_title"></h2><p class="muted" data-i18n="games_sub"></p></div></div>
      <div class="games" id="games"></div>
    </section>

    <section data-page="tools" hidden>
      <div class="ph"><div><h2 data-i18n="tools_title"></h2><p class="muted" data-i18n="tools_sub"></p></div></div>
      <div class="list" id="list-actions"></div>
    </section>

    <section data-page="settings" hidden>
      <div class="ph"><div><h2 data-i18n="settings_title"></h2></div></div>
      <div class="card set">
        <div class="srow"><div><h4 data-i18n="s_language"></h4><p class="muted" data-i18n="s_language_sub"></p></div><select id="s-lang"><option value="en">English</option><option value="fa">فارسی</option></select></div>
        <div class="srow"><div><h4 data-i18n="s_lite"></h4><p class="muted" data-i18n="s_lite_sub"></p><p class="muted hint" id="s-lite-hint" hidden><span data-i18n="s_restart_hint"></span> <a href="#" id="s-relaunch" data-i18n="s_restart_now"></a></p></div><label class="sw"><input type="checkbox" id="s-lite"><i></i></label></div>
      </div>
      <h3 class="sh" data-i18n="upd_title"></h3>
      <div class="card set">
        <div class="srow"><div><h4 id="u-status"></h4><p class="muted" data-i18n="upd_sub"></p><div class="prog" id="u-prog" hidden><i></i></div></div><button class="ghost" id="u-btn"></button></div>
        <div class="srow"><div><h4 data-i18n="upd_auto"></h4></div><label class="sw"><input type="checkbox" id="s-auto"><i></i></label></div>
      </div>
      <h3 class="sh" data-i18n="s_account"></h3>
      <div class="card set">
        <div class="srow"><div><h4 id="s-user"></h4><p class="muted" id="s-sub"></p></div><div class="acts"><button class="ghost" data-open="/account" data-i18n="s_manage"></button><button class="ghost" id="logout" data-i18n="logout"></button></div></div>
      </div>
      <h3 class="sh" data-i18n="s_about"></h3>
      <div class="card set">
        <div class="srow"><div><h4>FPS Boost <span class="muted" id="version2"></span></h4><p class="muted" data-i18n="win"></p></div><button class="ghost" data-open="/" ><svg><use href="#i-ext"/></svg><span data-i18n="s_site"></span></button></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="i18n.js"></script><script src="app.js"></script>
</body></html>
